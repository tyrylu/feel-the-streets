[package]
name = "server"
version = "0.1.0"
authors = ["Lukáš Tyrychtr <lukastyrychtr@gmail.com>"]
edition = "2021"

[dependencies]
log = "0.4.33"
aw3d30 = {path="../aw3d30"}
osm_db = {path="../osm_db"}
osm_api = {path="../osm_api"}
rusqlite = { "version" = "~0.40", "features" = ["bundled-windows", "load_extension", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
thiserror = "2.0.19"
dotenvy = "0.15.7"
base64 = "0.23.0"
doitlater = "0.5.0"
redis_api = {path = "../redis_api"}
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["async-read-body"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
tracing-subscriber = {version="0.3.23", features=["env-filter"]}
tower-http = { version = "0.7.0", features = ["trace", "fs"] }
askama = "0.16.0"
