[package]
name = "osm_db_py"
version = "0.1.0"
authors = ["Lukáš Tyrychtr <lukastyrychtr@gmail.com>"]
edition = "2021"

[dependencies]
osm_db = {"path" = "../osm_db"}
pyo3 = "0.29"
pyo3-log = "0.13.4"
log = "0.4.34"
serde_json = "1.0.154"
geo = "0.33.1"
dashmap = "6.2.1"
once_cell = "1.21.4"
wkb = "0.9.3"
geo-traits = "0.3.0"

[lib]
name = "osm_db"
crate-type = ["cdylib"]

[features]
default = ["pyo3/extension-module"]
